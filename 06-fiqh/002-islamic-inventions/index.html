function setLang(l){document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===l));}function setTheme(th){document.documentElement.dataset.theme=th;document.querySelectorAll("[data-thm]").forEach(b=>b.classList.toggle("on",b.dataset.thm===th));}let soundOn=true,actx;function snd(t){if(!soundOn)return;if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);g.gain.value=.06;const n=actx.currentTime;if(t==="ok"){o.frequency.value=523;o.type="sine";g.gain.exponentialRampToValueAtTime(.001,n+.1);o.start(n);o.stop(n+.1);}else if(t==="err"){o.frequency.value=200;o.type="square";g.gain.exponentialRampToValueAtTime(.001,n+.15);o.start(n);o.stop(n+.15);}else if(t==="win"){[523,659,784,1047].forEach((f,i)=>{const oo=actx.createOscillator(),gg=actx.createGain();oo.connect(gg);gg.connect(actx.destination);gg.gain.value=.04;oo.frequency.value=f;oo.type="sine";gg.gain.exponentialRampToValueAtTime(.001,n+.2+i*.12);oo.start(n+i*.12);oo.stop(n+.2+i*.12);});}else{o.frequency.value=800;o.type="sine";g.gain.exponentialRampToValueAtTime(.001,n+.05);o.start(n);o.stop(n+.05);}}function log(msg,cls){const b=document.getElementById("logBox");if(!b)return;const d=document.createElement("div");d.className="log-line "+(cls||"");d.textContent="["+new Date().toLocaleTimeString()+"] "+msg;b.appendChild(d);b.scrollTop=b.scrollHeight;}
let total=15,current=0,correct=0,ans,locked=false;
const Q=[{"q":"Algebra was developed by:","a":"Al-Khwarizmi","o":["Al-Khwarizmi","Euclid","Newton","Pythagoras"]},{"q":"The word 'algorithm' comes from:","a":"Al-Khwarizmi's name","o":["Al-Khwarizmi's name","Greek","Latin","English"]},{"q":"Ibn al-Haytham is the father of:","a":"Optics","o":["Optics","Chemistry","Biology","Music"]},{"q":"The first hospital was built in:","a":"Baghdad (9th century)","o":["Baghdad (9th century)","London","Paris","Rome"]},{"q":"Arabic numerals originated from:","a":"Indian-Arabic system","o":["Indian-Arabic system","Roman system","Greek system","Chinese system"]},{"q":"The astrolabe was used for:","a":"Navigation and astronomy","o":["Navigation and astronomy","Cooking","Writing","Building"]},{"q":"Al-Razi was a famous:","a":"Physician (doctor)","o":["Physician (doctor)","Painter","Poet","Soldier"]},{"q":"Coffee was first brewed in:","a":"Yemen/Ethiopia","o":["Yemen/Ethiopia","Italy","France","Brazil"]},{"q":"The University of Al-Qarawiyyin is:","a":"Oldest existing university","o":["Oldest existing university","Newest","Largest","Smallest"]},{"q":"Ibn Battuta was a famous:","a":"Traveler/explorer","o":["Traveler/explorer","King","Scientist","Poet"]}];let qi=0;function genQ(){const q=Q[qi%Q.length];qi++;return{text:"⭐ "+q.q,ans:q.a,opts:q.o.sort(()=>Math.random()-.5)};}
function newGame(){total=document.getElementById("diffSel")?parseInt(document.getElementById("diffSel").value):15;current=0;correct=0;document.getElementById("sc").textContent="0";document.getElementById("tot").textContent="0";document.getElementById("scorePill").textContent="0 / 0";nextQ();}
function nextQ(){if(current>=total){snd("win");document.getElementById("status").textContent="🏆 Done! "+correct+"/"+total;document.getElementById("status").className="status win";log("🏆 "+correct+"/"+total,"success");return;}locked=false;const q=genQ();document.getElementById("question").innerHTML=q.text;ans=q.ans;const el=document.getElementById("choices");el.innerHTML="";q.opts.forEach(o=>{const b=document.createElement("button");b.className="answer-btn";b.textContent=o;b.onclick=()=>pick(b,o);el.appendChild(b);});document.getElementById("status").textContent=(current+1)+"/"+total;document.getElementById("prog").style.width=(current/total*100)+"%";}
function pick(btn,val){if(locked)return;locked=true;current++;if(String(val)===String(ans)){correct++;btn.classList.add("correct");snd("ok");}else{btn.classList.add("wrong");snd("err");document.querySelectorAll(".answer-btn").forEach(b=>{if(b.textContent==ans)b.classList.add("correct");});}document.getElementById("sc").textContent=correct;document.getElementById("tot").textContent=current;document.getElementById("scorePill").textContent=correct+" / "+current;document.getElementById("prog").style.width=(current/total*100)+"%";setTimeout(nextQ,800);}

// Timer
let timerInterval,timerSeconds=0;
function startTimer(){timerSeconds=0;clearInterval(timerInterval);timerInterval=setInterval(()=>{timerSeconds++;const m=Math.floor(timerSeconds/60),s=timerSeconds%60;const el=document.getElementById("timerDisp");if(el)el.textContent="⏱ "+(m>0?m+"m ":"")+s+"s";},1000);}
function stopTimer(){clearInterval(timerInterval);}

// High Score
const HS_KEY="wdiy-hs-islamic-inventions";
function loadHS(){try{return parseInt(localStorage.getItem(HS_KEY))||0;}catch(e){return 0;}}
function saveHS(score){const best=loadHS();if(score>best){localStorage.setItem(HS_KEY,score);return true;}return false;}
function showHS(){const el=document.getElementById("bestDisp");if(el){const b=loadHS();el.textContent=b>0?"★ Best: "+b:"";}}

// Help panel keyboard
document.addEventListener("keydown",function(e){if(e.key==="Escape"){const o=document.getElementById("helpOverlay");if(o)o.classList.remove("open");}});

// Keyboard shortcuts: 1-4 for answers, Enter for next
document.addEventListener("keydown",function(e){
if(e.key>="1"&&e.key<="4"){const btns=document.querySelectorAll(".answer-btn");const i=parseInt(e.key)-1;if(btns[i])btns[i].click();}
if(e.key==="Enter"){const go=document.getElementById("enterBtn");if(go&&go.offsetParent!==null)go.click();const start=document.getElementById("startBtn");if(start&&start.offsetParent!==null)start.click();}
});

// Persist sound preference
try{if(localStorage.getItem("wdiy-mute")==="1"){soundOn=false;var sb=document.getElementById("soundBtn");if(sb)sb.textContent="🔇";}}catch(e){}
var _origSoundClick=document.getElementById("soundBtn");
if(_origSoundClick){_origSoundClick.addEventListener("click",function(){try{localStorage.setItem("wdiy-mute",soundOn?"0":"1");}catch(e){}});}

// Persist theme and language
try{var _sl=localStorage.getItem("wdiy-lang");if(_sl)setLang(_sl);var _st=localStorage.getItem("wdiy-theme");if(_st)setTheme(_st);}catch(e){}
(function(){var _osl=setLang,_ost=setTheme;
setLang=function(l){_osl(l);try{localStorage.setItem("wdiy-lang",l);}catch(e){}};
setTheme=function(t){_ost(t);try{localStorage.setItem("wdiy-theme",t);}catch(e){}};})();

</script></body></html>
